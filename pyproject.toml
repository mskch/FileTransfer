[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sft-experiment"
version = "1.0.0"
description = "Mutually authenticated, resumable file transfer experiment"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.8,<7"]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["secure_transfer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
